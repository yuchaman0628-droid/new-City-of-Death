<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>死の市 - Outdoor Horror Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Courier New', Courier, serif, monospace;
      user-select: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* レトロVHS・走査線効果 */
    #vhs-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.25),
        rgba(0, 0, 0, 0.25) 1px,
        transparent 1px,
        transparent 2px
      );
      box-shadow: inset 0 0 160px rgba(0,0,0,0.92);
      z-index: 10;
    }

    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 4px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
      display: none;
    }

    #ui {
      position: absolute;
      top: 20px; left: 20px;
      color: #aaa;
      z-index: 20;
      pointer-events: none;
      font-size: 13px;
      letter-spacing: 2px;
      display: none;
    }

    /* タイトル画面 */
    #title-screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(20, 2, 2, 0.96) 0%, rgba(0,0,0,0.99) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
      color: #eee;
    }

    .game-title {
      font-size: 76px;
      color: #b30000;
      letter-spacing: 16px;
      margin-bottom: 5px;
      text-shadow: 0 0 25px rgba(255, 0, 0, 0.8), 4px 4px 0px #000;
      animation: pulse 3s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.75; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
      100% { opacity: 1; text-shadow: 0 0 35px rgba(255, 0, 0, 1), 0 0 8px rgba(255,255,255,0.7); }
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      letter-spacing: 6px;
      margin-bottom: 50px;
    }

    .btn-start {
      background: transparent;
      border: 1px solid #666;
      color: #ddd;
      padding: 14px 42px;
      font-size: 18px;
      font-family: inherit;
      letter-spacing: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-start:hover {
      background: #800000;
      color: #fff;
      border-color: #f00;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
    }

    .controls-hint {
      margin-top: 40px;
      font-size: 11px;
      color: #666;
      letter-spacing: 1px;
      line-height: 1.8;
      text-align: center;
    }

    /* ゲームオーバー画面 */
    #gameover-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(60, 0, 0, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      animation: goFlash 0.1s infinite alternate;
    }

    @keyframes goFlash {
      0% { background-color: rgba(90, 0, 0, 0.95); }
      100% { background-color: rgba(10, 0, 0, 0.98); }
    }

    .go-title {
      font-size: 72px;
      color: #ff1111;
      font-weight: bold;
      letter-spacing: 14px;
      text-shadow: 0 0 20px #000, 0 0 40px #f00;
      margin-bottom: 20px;
    }

    .go-sub {
      font-size: 15px;
      color: #ddd;
      letter-spacing: 4px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="vhs-overlay"></div>
  <div id="crosshair"></div>
  <div id="ui">『死の市』- 拡張街区</div>

  <div id="title-screen">
    <div class="game-title">死 の 市</div>
    <div class="subtitle">- EXPANDED STREETS -</div>
    <button class="btn-start" id="start-btn">街 に 入 る</button>
    <div class="controls-hint">
      [W/A/S/D] 移動 | [マウス] 視点変更<br>
      ※敵に捕まるとゲームオーバーになります
    </div>
  </div>

  <div id="gameover-overlay">
    <div class="go-title">G A M E   O V E R</div>
    <div class="go-sub">死の市に囚われ、あなたは帰らぬ者となった...</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- 音声システム (Web Audio API) ---
    class AudioSystem {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.oscillators = [];
        this.gainNode = null;
      }

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        this.gainNode = this.ctx.createGain();
        this.gainNode.gain.setValueAtTime(0.3, this.ctx.currentTime);
        this.gainNode.connect(this.ctx.destination);
      }

      startBGM() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.isPlaying) return;
        this.isPlaying = true;

        const osc1 = this.ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(38, this.ctx.currentTime);

        const osc2 = this.ctx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(39.5, this.ctx.currentTime);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(130, this.ctx.currentTime);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(this.gainNode);

        osc1.start();
        osc2.start();
        this.oscillators = [osc1, osc2];
      }

      playHeartbeat() {
        if (!this.ctx || !this.isPlaying) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(55, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + 0.18);

        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      }

      playGameoverSound() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 2.0);

        gain.gain.setValueAtTime(0.9, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 2.0);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 2.0);
      }

      stopBGM() {
        if (!this.isPlaying) return;
        this.isPlaying = false;
        this.oscillators.forEach(osc => {
          try { osc.stop(); } catch(e){}
        });
        this.oscillators = [];
      }
    }

    const audio = new AudioSystem();

    // --- 3Dグラフィック環境 ---
    const container = document.getElementById('canvas-container');
    const titleScreen = document.getElementById('title-screen');
    const startBtn = document.getElementById('start-btn');
    const crosshair = document.getElementById('crosshair');
    const ui = document.getElementById('ui');
    const gameoverOverlay = document.getElementById('gameover-overlay');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020205);
    scene.fog = new THREE.FogExp2(0x020205, 0.05);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.rotation.order = 'YXZ';

    const player = new THREE.Object3D();
    player.position.set(0, 1.6, 25);
    player.add(camera);
    scene.add(player);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // ライティング
    const ambientLight = new THREE.AmbientLight(0x151b2d, 0.7);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x4466aa, 0.6);
    moonLight.position.set(20, 40, 20);
    moonLight.castShadow = true;
    scene.add(moonLight);

    const flashlight = new THREE.SpotLight(0xfff3d6, 4.0, 25, Math.PI / 4, 0.4, 1);
    camera.add(flashlight);
    flashlight.position.set(0, 0, 0);
    flashlight.target.position.set(0, 0, -1);
    camera.add(flashlight.target);

    // 床・街のマップ
    const floorGeo = new THREE.PlaneGeometry(80, 160);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.9 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    function buildCity() {
      const bldgMat = new THREE.MeshStandardMaterial({ color: 0x1a1a22, roughness: 0.8 });
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x2b2b33, roughness: 0.6 });

      for (let z = -70; z <= 50; z += 16) {
        const leftHeight = 9 + (Math.abs(z * 3) % 7);
        const leftBldg = new THREE.Mesh(new THREE.BoxGeometry(12, leftHeight, 12), bldgMat);
        leftBldg.position.set(-14, leftHeight / 2, z);
        leftBldg.castShadow = true;
        leftBldg.receiveShadow = true;
        scene.add(leftBldg);

        const rightHeight = 10 + (Math.abs(z * 5) % 8);
        const rightBldg = new THREE.Mesh(new THREE.BoxGeometry(12, rightHeight, 12), bldgMat);
        rightBldg.position.set(14, rightHeight / 2, z);
        rightBldg.castShadow = true;
        rightBldg.receiveShadow = true;
        scene.add(rightBldg);
      }

      for (let z = -60; z <= 40; z += 20) {
        const poleL = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 8, 8), poleMat);
        poleL.position.set(-6.5, 4, z);
        scene.add(poleL);

        const lightL = new THREE.PointLight(0xffb84d, 1.2, 12);
        lightL.position.set(-6.0, 7.5, z);
        scene.add(lightL);

        const poleR = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 8, 8), poleMat);
        poleR.position.set(6.5, 4, z + 10);
        scene.add(poleR);

        const lightR = new THREE.PointLight(0xffb84d, 1.2, 12);
        lightR.position.set(6.0, 7.5, z + 10);
        scene.add(lightR);
      }
    }
    buildCity();

    let signLight;
    function createMainSign() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#050202';
      ctx.fillRect(0, 0, 512, 256);
      ctx.font = 'Bold 90px serif';
      ctx.fillStyle = '#e60000';
      ctx.textAlign = 'center';
      ctx.fillText('死 の 市', 256, 150);

      const texture = new THREE.CanvasTexture(canvas);
      const geo = new THREE.PlaneGeometry(6, 3);
      const mat = new THREE.MeshBasicMaterial({ map: texture });
      const signMesh = new THREE.Mesh(geo, mat);
      signMesh.position.set(0, 5, -55);
      scene.add(signMesh);

      signLight = new THREE.PointLight(0xff0000, 2.5, 15);
      signLight.position.set(0, 5, -53);
      scene.add(signLight);
    }
    createMainSign();

    // モンスター
    const monsterGroup = new THREE.Group();
    const monsterMat = new THREE.MeshStandardMaterial({ color: 0x08080a, roughness: 0.9 });

    const bodyGeo = new THREE.CylinderGeometry(0.25, 0.12, 2.8, 8);
    const body = new THREE.Mesh(bodyGeo, monsterMat);
    body.position.y = 1.4;
    monsterGroup.add(body);

    const headGeo = new THREE.SphereGeometry(0.38, 8, 8);
    const head = new THREE.Mesh(headGeo, monsterMat);
    head.position.y = 2.9;
    monsterGroup.add(head);

    const eyeGeo = new THREE.SphereGeometry(0.065, 8, 8);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.13, 2.95, -0.32);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.13, 2.95, -0.32);
    monsterGroup.add(leftEye);
    monsterGroup.add(rightEye);

    monsterGroup.position.set(0, 0, -65);
    scene.add(monsterGroup);

    // --- ゲーム進行＆ゲームオーバー処理 ---
    let isPlaying = false;
    let isChasing = false;
    let isGameOver = false;

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let heartbeatTimer = 0;

    function resetGame() {
      player.position.set(0, 1.6, 25);
      player.rotation.set(0, 0, 0);
      camera.rotation.set(0, 0, 0);
      monsterGroup.position.set(0, 0, -65);
      isChasing = false;
      isGameOver = false;
      gameoverOverlay.style.display = 'none';
    }

    startBtn.addEventListener('click', () => {
      resetGame();
      document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === document.body && !isGameOver) {
        isPlaying = true;
        titleScreen.style.display = 'none';
        crosshair.style.display = 'block';
        ui.style.display = 'block';
        audio.startBGM();
      } else if (!isGameOver) {
        isPlaying = false;
        titleScreen.style.display = 'flex';
        crosshair.style.display = 'none';
        ui.style.display = 'none';
        audio.stopBGM();
      }
    });

    // 視点移動
    document.addEventListener('mousemove', (e) => {
      if (!isPlaying || isGameOver) return;

      const sensitivity = 0.002;
      player.rotation.y -= e.movementX * sensitivity;
      
      camera.rotation.x -= e.movementY * sensitivity;
      camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
    });

    document.addEventListener('keydown', (e) => {
      switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
      }
    });

    // 【ゲームオーバー処理】敵に接触した場合に発動
    function triggerGameOver() {
      if (isGameOver) return;
      isGameOver = true;
      isPlaying = false;
      document.exitPointerLock();

      audio.stopBGM();
      audio.playGameoverSound();

      // モンスターをカメラ目の前に瞬間配置
      monsterGroup.position.copy(player.position);
      monsterGroup.position.z -= 0.8;
      camera.lookAt(monsterGroup.position.x, 2.5, monsterGroup.position.z);

      // ゲームオーバーUI表示
      gameoverOverlay.style.display = 'flex';

      // 3秒後にタイトル画面へ復帰
      setTimeout(() => {
        gameoverOverlay.style.display = 'none';
        titleScreen.style.display = 'flex';
        crosshair.style.display = 'none';
        ui.style.display = 'none';
        resetGame();
      }, 3000);
    }

    // --- アニメーションループ ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      if (isPlaying && !isGameOver) {
        const moveSpeed = 3.6 * delta;
        
        if (moveForward) player.translateZ(-moveSpeed);
        if (moveBackward) player.translateZ(moveSpeed);
        if (moveLeft) player.translateX(-moveSpeed);
        if (moveRight) player.translateX(moveSpeed);

        player.position.y = 1.6;

        // エリアの移動上限
        player.position.x = Math.max(-6.0, Math.min(6.0, player.position.x));
        player.position.z = Math.max(-68, Math.min(35, player.position.z));

        // 懐中電灯ブレ
        if (moveForward || moveBackward || moveLeft || moveRight) {
          flashlight.position.y = Math.sin(time * 10) * 0.02;
          flashlight.position.x = Math.cos(time * 5) * 0.02;
        }

        // モンスターAI
        const distanceToMonster = player.position.distanceTo(monsterGroup.position);

        if (player.position.z < 5 && !isChasing) {
          isChasing = true;
        }

        if (isChasing) {
          monsterGroup.lookAt(player.position.x, 0, player.position.z);
          
          head.position.x = Math.sin(time * 35) * 0.06;
          head.position.z = Math.cos(time * 35) * 0.06;

          heartbeatTimer += delta;
          const heartbeatInterval = Math.max(0.25, distanceToMonster * 0.06);
          if (heartbeatTimer > heartbeatInterval) {
            audio.playHeartbeat();
            heartbeatTimer = 0;
          }

          const chaseSpeed = 3.2 * delta;
          const chaseDir = new THREE.Vector3().subVectors(player.position, monsterGroup.position);
          chaseDir.y = 0;
          chaseDir.normalize();

          monsterGroup.position.addScaledVector(chaseDir, chaseSpeed);

          // 捕獲判定：1.5m以内に近づいたらゲームオーバー発生
          if (distanceToMonster < 1.5) {
            triggerGameOver();
          }
        }
      }

      if (signLight) {
        signLight.intensity = Math.random() > 0.06 ? 2.5 : 0.2;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
