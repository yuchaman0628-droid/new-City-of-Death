<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>死の市 - GameOver Enhanced Edition</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Courier New', Courier, serif, monospace;
      user-select: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* レトロVHS・走査線効果 */
    #vhs-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.25),
        rgba(0, 0, 0, 0.25) 1px,
        transparent 1px,
        transparent 2px
      );
      box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
      z-index: 10;
    }

    /* 被弾・死亡時の赤フラッシュ */
    #flash-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(255, 0, 0, 0.7);
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 4px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
      display: none;
    }

    /* UI */
    #ui {
      position: absolute;
      top: 20px; left: 20px;
      color: #ddd;
      z-index: 20;
      pointer-events: none;
      font-size: 13px;
      letter-spacing: 2px;
      display: none;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 14px;
      border: 1px solid #444;
      border-left: 4px solid #b30000;
      margin-bottom: 8px;
    }

    #stamina-bar-bg {
      width: 150px;
      height: 8px;
      background: #222;
      border: 1px solid #555;
      margin-top: 6px;
    }

    #stamina-bar {
      width: 100%;
      height: 100%;
      background: #00b359;
      transition: width 0.1s linear, background-color 0.2s;
    }

    /* メッセージ通知 */
    #message-log {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      color: #ff3333;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
      z-index: 20;
      pointer-events: none;
      text-shadow: 0 0 10px #000;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    /* 共通ボタンデザイン */
    .btn-action {
      background: transparent;
      border: 1px solid #666;
      color: #ddd;
      padding: 14px 42px;
      font-size: 18px;
      font-family: inherit;
      letter-spacing: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .btn-action:hover {
      background: #800000;
      color: #fff;
      border-color: #f00;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
    }

    /* タイトル画面 */
    #title-screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(20, 2, 2, 0.96) 0%, rgba(0,0,0,0.99) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
      color: #eee;
    }

    .game-title {
      font-size: 76px;
      color: #b30000;
      letter-spacing: 16px;
      margin-bottom: 5px;
      text-shadow: 0 0 25px rgba(255, 0, 0, 0.8), 4px 4px 0px #000;
      animation: pulse 3s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.75; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
      100% { opacity: 1; text-shadow: 0 0 35px rgba(255, 0, 0, 1), 0 0 8px rgba(255,255,255,0.7); }
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      letter-spacing: 6px;
      margin-bottom: 10px;
    }

    .controls-hint {
      margin-top: 25px;
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
      line-height: 1.8;
      text-align: center;
    }

    /* ゲームオーバー画面 */
    #gameover-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(40, 0, 0, 0.96);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      animation: goFlash 0.15s infinite alternate;
    }

    @keyframes goFlash {
      0% { background-color: rgba(60, 0, 0, 0.96); }
      100% { background-color: rgba(10, 0, 0, 0.98); }
    }

    .go-title {
      font-size: 80px;
      color: #ff0000;
      font-weight: bold;
      letter-spacing: 16px;
      text-shadow: 0 0 20px #000, 0 0 40px #f00;
      margin-bottom: 15px;
    }

    .go-sub {
      font-size: 16px;
      color: #ccc;
      letter-spacing: 4px;
      margin-bottom: 30px;
      text-shadow: 0 0 5px #000;
    }

    .go-hint {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      letter-spacing: 2px;
    }

    /* クリア画面 */
    #clear-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 20, 10, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }

    .clear-title {
      font-size: 64px;
      color: #00ff88;
      font-weight: bold;
      letter-spacing: 12px;
      text-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
      margin-bottom: 20px;
    }

    .clear-sub {
      font-size: 15px;
      color: #eee;
      letter-spacing: 4px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="vhs-overlay"></div>
  <div id="flash-overlay"></div>
  <div id="crosshair"></div>

  <div id="ui">
    <div class="hud-box">
      <div>『死の市』からの生還</div>
      <div style="margin-top:4px;">鍵: <span id="key-count" style="color:#ff3333; font-weight:bold;">0 / 3</span></div>
    </div>
    <div class="hud-box">
      <div>STAMINA</div>
      <div id="stamina-bar-bg"><div id="stamina-bar"></div></div>
    </div>
  </div>

  <div id="message-log"></div>

  <!-- タイトル画面 -->
  <div id="title-screen">
    <div class="game-title">死 の 市</div>
    <div class="subtitle">- HARD & WIDE STREETS -</div>
    <button class="btn-action" id="start-btn">街 に 入 る</button>
    <div class="controls-hint">
      [W/A/S/D] 移動 | [Shift] ダッシュ | [マウス] 視点変更<br>
      【目標】街を徘徊する異形を避け、<span style="color:#ff3333">3つの鍵</span> を見つけて脱出せよ。<br>
      化け物に触れると即死亡します。建物を壁にして逃げ切りましょう。
    </div>
  </div>

  <!-- ゲームオーバー画面 -->
  <div id="gameover-overlay">
    <div class="go-title">G A M E   O V E R</div>
    <div class="go-sub">死の市に囚われ、あなたの意識は闇へと消えた...</div>
    <button class="btn-action" id="retry-btn">タイトルへ戻る</button>
    <div class="go-hint">[ Space ] または画面クリックでも戻れます</div>
  </div>

  <!-- クリア画面 -->
  <div id="clear-overlay">
    <div class="clear-title">E S C A P E D</div>
    <div class="clear-sub">あなたは無事に死の市から脱出した！</div>
    <button class="btn-action" id="clear-title-btn">タイトルへ戻る</button>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- サウンドシステム ---
    class AudioSystem {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.oscillators = [];
        this.gainNode = null;
      }

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();

        this.gainNode = this.ctx.createGain();
        this.gainNode.gain.setValueAtTime(0.3, this.ctx.currentTime);
        this.gainNode.connect(this.ctx.destination);
      }

      startBGM() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.isPlaying) return;
        this.isPlaying = true;

        const osc1 = this.ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(32, this.ctx.currentTime);

        const osc2 = this.ctx.createOscillator();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(34.5, this.ctx.currentTime);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(100, this.ctx.currentTime);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(this.gainNode);

        osc1.start();
        osc2.start();

        const bufferSize = this.ctx.sampleRate * 2;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = this.ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const noiseFilter = this.ctx.createBiquadFilter();
        noiseFilter.type = 'bandpass';
        noiseFilter.frequency.setValueAtTime(200, this.ctx.currentTime);
        noiseFilter.Q.setValueAtTime(3.0, this.ctx.currentTime);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.08, this.ctx.currentTime);

        whiteNoise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(this.gainNode);

        whiteNoise.start();

        this.oscillators = [osc1, osc2, whiteNoise];
      }

      playHeartbeat() {
        if (!this.ctx || !this.isPlaying) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(70, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(18, this.ctx.currentTime + 0.18);

        gain.gain.setValueAtTime(0.7, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      }

      playKeyPickup() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
        osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.1);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
      }

      playGameoverSound() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(20, this.ctx.currentTime + 2.5);

        gain.gain.setValueAtTime(1.0, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 2.5);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 2.5);
      }

      stopBGM() {
        if (!this.isPlaying) return;
        this.isPlaying = false;
        this.oscillators.forEach(osc => {
          try { osc.stop(); } catch(e){}
        });
        this.oscillators = [];
      }
    }

    const audio = new AudioSystem();

    // --- DOM要素 ---
    const container = document.getElementById('canvas-container');
    const titleScreen = document.getElementById('title-screen');
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const clearTitleBtn = document.getElementById('clear-title-btn');
    const crosshair = document.getElementById('crosshair');
    const ui = document.getElementById('ui');
    const keyCountEl = document.getElementById('key-count');
    const staminaBar = document.getElementById('stamina-bar');
    const msgLog = document.getElementById('message-log');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const clearOverlay = document.getElementById('clear-overlay');
    const flashOverlay = document.getElementById('flash-overlay');

    // --- 3Dグラフィック環境 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020205);
    scene.fog = new THREE.FogExp2(0x020205, 0.04);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.rotation.order = 'YXZ';

    const player = new THREE.Object3D();
    player.position.set(0, 1.6, 25);
    player.add(camera);
    scene.add(player);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.2));
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x222a3d, 0.8);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x4466aa, 0.4);
    moonLight.position.set(20, 50, 20);
    scene.add(moonLight);

    const flashlight = new THREE.SpotLight(0xfff3d6, 4.0, 26, Math.PI / 4, 0.4, 1);
    camera.add(flashlight);
    flashlight.position.set(0, 0, 0);
    flashlight.target.position.set(0, 0, -1);
    camera.add(flashlight.target);

    // 床
    const floorGeo = new THREE.PlaneGeometry(180, 160);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.9 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // テクスチャ
    function generateBuildingTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#121216';
      ctx.fillRect(0, 0, 128, 256);

      const cols = 3; const rows = 8;
      const padX = 12; const padY = 10;
      const w = (128 - padX * (cols + 1)) / cols;
      const h = (256 - padY * (rows + 1)) / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = padX + c * (w + padX);
          const y = padY + r * (h + padY);

          if (Math.random() < 0.2) {
            ctx.fillStyle = Math.random() < 0.5 ? '#ffe082' : '#80d8ff';
          } else {
            ctx.fillStyle = '#08080c';
          }
          ctx.fillRect(x, y, w, h);
        }
      }
      return new THREE.CanvasTexture(canvas);
    }

    const bldgTexture = generateBuildingTexture();

    // --- 建物の当たり判定データ ---
    const buildingColliders = [];

    // マップ構築
    function buildWideCity() {
      const bldgMat = new THREE.MeshStandardMaterial({ map: bldgTexture, roughness: 0.8 });
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x222228 });

      for (let z = -70; z <= 50; z += 18) {
        for (let x = -45; x <= 45; x += 30) {
          if (Math.abs(x) < 8 && z > -50) continue;

          const h = 10 + (Math.abs(x * z) % 8);
          const w = 16;
          const d = 14;
          const bldg = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bldgMat);
          const posX = x + (z % 4);
          bldg.position.set(posX, h / 2, z);
          scene.add(bldg);

          buildingColliders.push({
            minX: posX - w / 2,
            maxX: posX + w / 2,
            minZ: z - d / 2,
            maxZ: z + d / 2
          });
        }
      }

      for (let z = -60; z <= 40; z += 25) {
        [-18, 0, 18].forEach(xPos => {
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 6), poleMat);
          pole.position.set(xPos, 3.5, z);
          scene.add(pole);

          const light = new THREE.PointLight(0xffb84d, 1.2, 12);
          light.position.set(xPos, 6.5, z);
          scene.add(light);
        });
      }
    }
    buildWideCity();

    // 看板・扉
    let exitDoor;
    function createMainSignAndDoor() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#050202';
      ctx.fillRect(0, 0, 512, 256);
      ctx.font = 'Bold 90px serif';
      ctx.fillStyle = '#e60000';
      ctx.textAlign = 'center';
      ctx.fillText('死 の 市', 256, 150);

      const texture = new THREE.CanvasTexture(canvas);
      const signMesh = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), new THREE.MeshBasicMaterial({ map: texture }));
      signMesh.position.set(0, 5, -55);
      scene.add(signMesh);

      const signLight = new THREE.PointLight(0xff0000, 2.0, 12);
      signLight.position.set(0, 5, -53);
      scene.add(signLight);

      const doorGeo = new THREE.BoxGeometry(3.5, 5, 0.2);
      const doorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      exitDoor = new THREE.Mesh(doorGeo, doorMat);
      exitDoor.position.set(0, 2.5, -62);
      scene.add(exitDoor);

      const doorLight = new THREE.PointLight(0x00ff88, 1.0, 8);
      doorLight.position.set(0, 5.2, -61);
      scene.add(doorLight);
    }
    createMainSignAndDoor();

    // 鍵モデル
    function createKey3DModel() {
      const keyGroup = new THREE.Group();
      const goldMat = new THREE.MeshStandardMaterial({
        color: 0xffcc00,
        metalness: 0.8,
        roughness: 0.3,
        emissive: 0x443300
      });

      const headGeo = new THREE.TorusGeometry(0.18, 0.04, 8, 16);
      const headMesh = new THREE.Mesh(headGeo, goldMat);
      headMesh.position.y = 0.4;
      keyGroup.add(headMesh);

      const shaftGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.5, 8);
      const shaftMesh = new THREE.Mesh(shaftGeo, goldMat);
      shaftMesh.position.y = 0.15;
      keyGroup.add(shaftMesh);

      const toothGeo = new THREE.BoxGeometry(0.12, 0.15, 0.03);
      const toothMesh = new THREE.Mesh(toothGeo, goldMat);
      toothMesh.position.set(0.06, 0.0, 0);
      keyGroup.add(toothMesh);

      return keyGroup;
    }

    const keys = [];
    const keyPositions = [
      new THREE.Vector3(-32, 0.8, 10),
      new THREE.Vector3(32, 0.8, -10),
      new THREE.Vector3(-15, 0.8, -42)
    ];

    function spawnKeys() {
      keys.forEach(k => {
        scene.remove(k.mesh);
        if(k.light) scene.remove(k.light);
      });
      keys.length = 0;

      keyPositions.forEach(pos => {
        const mesh = createKey3DModel();
        mesh.position.copy(pos);
        scene.add(mesh);

        const pointLight = new THREE.PointLight(0xffaa00, 1.5, 5);
        pointLight.position.copy(pos);
        scene.add(pointLight);

        keys.push({ mesh, light: pointLight, collected: false });
      });
    }

    // モンスター生成
    function createMonster(eyeColorHex = 0xff0000) {
      const group = new THREE.Group();
      const monsterMat = new THREE.MeshStandardMaterial({ color: 0x08080a, roughness: 0.9 });

      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.12, 2.8, 8), monsterMat);
      body.position.y = 1.4;
      group.add(body);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 8, 8), monsterMat);
      head.position.y = 2.9;
      group.add(head);

      const eyeGeo = new THREE.SphereGeometry(0.065, 8, 8);
      const eyeMat = new THREE.MeshBasicMaterial({ color: eyeColorHex });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.13, 2.95, -0.32);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.13, 2.95, -0.32);
      group.add(leftEye);
      group.add(rightEye);

      return { group, head };
    }

    const monster1 = createMonster(0xff0000);
    monster1.group.position.set(0, 0, -65);
    scene.add(monster1.group);

    const monster2 = createMonster(0x00ff44);
    monster2.group.position.set(-30, 0, -15);
    scene.add(monster2.group);

    let patrolTargetX = 30;
    const patrolSpeed = 2.8;

    function triggerRedFlash() {
      flashOverlay.style.opacity = '1';
      setTimeout(() => {
        flashOverlay.style.opacity = '0';
      }, 300);
    }

    // ゲーム状態
    let isPlaying = false;
    let isChasing = false;
    let isGameOver = false;
    let isCleared = false;

    let keysCollectedCount = 0;
    let stamina = 100;
    const maxStamina = 100;
    let isExhausted = false;

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let isSprinting = false;
    let heartbeatTimer = 0;

    let isJumpingOver = false;
    let jumpTime = 0;

    function showMessage(msg) {
      msgLog.textContent = msg;
      msgLog.style.opacity = '1';
      setTimeout(() => { msgLog.style.opacity = '0'; }, 2500);
    }

    function returnToTitle() {
      gameoverOverlay.style.display = 'none';
      clearOverlay.style.display = 'none';
      titleScreen.style.display = 'flex';
      crosshair.style.display = 'none';
      ui.style.display = 'none';
      resetGame();
    }

    function resetGame() {
      player.position.set(0, 1.6, 25);
      player.rotation.set(0, 0, 0);
      camera.rotation.set(0, 0, 0);
      
      monster1.group.position.set(0, 0, -65);
      monster2.group.position.set(-30, 0, -15);
      patrolTargetX = 30;

      isChasing = false;
      isGameOver = false;
      isCleared = false;
      isJumpingOver = false;
      jumpTime = 0;

      keysCollectedCount = 0;
      stamina = maxStamina;
      isExhausted = false;

      keyCountEl.textContent = `0 / ${keyPositions.length}`;
      staminaBar.style.width = '100%';
      staminaBar.style.backgroundColor = '#00b359';

      spawnKeys();
    }

    startBtn.addEventListener('click', () => {
      resetGame();
      document.body.requestPointerLock();
    });

    retryBtn.addEventListener('click', returnToTitle);
    clearTitleBtn.addEventListener('click', returnToTitle);

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === document.body && !isGameOver && !isCleared) {
        isPlaying = true;
        titleScreen.style.display = 'none';
        crosshair.style.display = 'block';
        ui.style.display = 'block';
        audio.startBGM();
      } else if (!isGameOver && !isCleared) {
        isPlaying = false;
        titleScreen.style.display = 'flex';
        crosshair.style.display = 'none';
        ui.style.display = 'none';
        audio.stopBGM();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!isPlaying || isGameOver || isCleared) return;

      const sensitivity = 0.002;
      player.rotation.y -= e.movementX * sensitivity;
      
      camera.rotation.x -= e.movementY * sensitivity;
      camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
    });

    document.addEventListener('keydown', (e) => {
      if (isGameOver) {
        if (e.code === 'Space' || e.code === 'Enter') returnToTitle();
        return;
      }

      switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
        case 'ShiftLeft':
        case 'ShiftRight': isSprinting = true; break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
        case 'ShiftLeft':
        case 'ShiftRight': isSprinting = false; break;
      }
    });

    gameoverOverlay.addEventListener('click', (e) => {
      if (e.target !== retryBtn) returnToTitle();
    });

    // --- 建物（壁）判定関数 ---
    function checkBuildingCollision(newX, newZ, radius = 0.6) {
      for (let i = 0; i < buildingColliders.length; i++) {
        const b = buildingColliders[i];
        if (newX + radius > b.minX && newX - radius < b.maxX &&
            newZ + radius > b.minZ && newZ - radius < b.maxZ) {
          return true;
        }
      }
      return false;
    }

    // --- 【新機能】モンスターと壁の衝突移動ロジック（滑り移動） ---
    function moveMonsterWithCollision(monsterGroup, moveVec, radius = 0.5) {
      const oldX = monsterGroup.position.x;
      const oldZ = monsterGroup.position.z;

      const targetX = oldX + moveVec.x;
      const targetZ = oldZ + moveVec.z;

      // XZ両方で試す
      if (!checkBuildingCollision(targetX, targetZ, radius)) {
        monsterGroup.position.x = targetX;
        monsterGroup.position.z = targetZ;
      } else {
        // X移動のみ試す（壁を滑る）
        if (!checkBuildingCollision(targetX, oldZ, radius)) {
          monsterGroup.position.x = targetX;
        } 
        // Z移動のみ試す（壁を滑る）
        else if (!checkBuildingCollision(oldX, targetZ, radius)) {
          monsterGroup.position.z = targetZ;
        }
      }
    }

    // --- ゲームオーバー演出（ジャンプアクション＆死亡） ---
    function triggerGameOver(caughtMonsterGroup) {
      if (isGameOver || isCleared) return;
      isGameOver = true;
      isPlaying = false;
      document.exitPointerLock();

      audio.stopBGM();
      audio.playGameoverSound();
      triggerRedFlash();

      caughtMonsterGroup.position.copy(player.position);
      caughtMonsterGroup.position.z -= 0.8;

      isJumpingOver = true;
      jumpTime = 0;
    }

    function triggerGameClear() {
      if (isCleared || isGameOver) return;
      isCleared = true;
      isPlaying = false;
      document.exitPointerLock();

      audio.stopBGM();
      clearOverlay.style.display = 'flex';
    }

    // --- メインループ ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // 鍵アニメーション
      keys.forEach(k => {
        if (!k.collected) {
          k.mesh.rotation.y += delta * 2.5;
          k.mesh.position.y = 0.8 + Math.sin(time * 3) * 0.1;
          if (k.light) k.light.position.y = k.mesh.position.y;
        }
      });

      // 死亡時ジャンプ演出
      if (isJumpingOver) {
        jumpTime += delta * 5;
        player.position.y = 1.6 + Math.sin(jumpTime) * 1.2;
        camera.rotation.x = -Math.PI / 3 + (Math.random() - 0.5) * 0.2;
        camera.rotation.z = (Math.random() - 0.5) * 0.3;

        if (jumpTime > Math.PI) {
          isJumpingOver = false;
          gameoverOverlay.style.display = 'flex';
        }
      }

      if (isPlaying && !isGameOver && !isCleared) {
        // プレイヤー移動
        const isMoving = moveForward || moveBackward || moveLeft || moveRight;
        let speedMultiplier = 1.0;

        if (isSprinting && isMoving && !isExhausted) {
          speedMultiplier = 1.75;
          stamina -= 50 * delta;
          if (stamina <= 0) {
            stamina = 0;
            isExhausted = true;
            staminaBar.style.backgroundColor = '#ff3333';
          }
        } else {
          stamina += 15 * delta;
          if (stamina >= maxStamina) {
            stamina = maxStamina;
            isExhausted = false;
            staminaBar.style.backgroundColor = '#00b359';
          }
        }

        staminaBar.style.width = `${(stamina / maxStamina) * 100}%`;

        const moveSpeed = 3.6 * speedMultiplier * delta;
        const oldX = player.position.x;
        const oldZ = player.position.z;

        if (moveForward) player.translateZ(-moveSpeed);
        if (moveBackward) player.translateZ(moveSpeed);
        if (moveLeft) player.translateX(-moveSpeed);
        if (moveRight) player.translateX(moveSpeed);

        player.position.y = 1.6;

        // プレイヤーの建物衝突
        if (checkBuildingCollision(player.position.x, player.position.z, 0.6)) {
          if (!checkBuildingCollision(player.position.x, oldZ, 0.6)) {
            player.position.z = oldZ;
          } else if (!checkBuildingCollision(oldX, player.position.z, 0.6)) {
            player.position.x = oldX;
          } else {
            player.position.x = oldX;
            player.position.z = oldZ;
          }
        }

        // 境界チェック
        player.position.x = Math.max(-42.0, Math.min(42.0, player.position.x));
        player.position.z = Math.max(-63, Math.min(35, player.position.z));

        // 鍵判定
        keys.forEach(k => {
          if (!k.collected && player.position.distanceTo(k.mesh.position) < 1.5) {
            k.collected = true;
            scene.remove(k.mesh);
            if (k.light) scene.remove(k.light);
            keysCollectedCount++;
            keyCountEl.textContent = `${keysCollectedCount} / ${keyPositions.length}`;
            audio.playKeyPickup();

            if (keysCollectedCount < keyPositions.length) {
              showMessage(`鍵を手に入れた (${keysCollectedCount}/${keyPositions.length})`);
            } else {
              showMessage('すべての鍵が集まった！中央最深部の扉から脱出せよ！');
            }
          }
        });

        // 脱出判定
        if (player.position.z < -60 && Math.abs(player.position.x) < 4) {
          if (keysCollectedCount >= keyPositions.length) {
            triggerGameClear();
          } else {
            showMessage('扉は鍵がかかっている... (鍵が3つ必要)');
          }
        }

        // --- 【モンスター1（追跡型）のAI＆衝突判定】 ---
        const dist1 = player.position.distanceTo(monster1.group.position);

        if (player.position.z < 10 && !isChasing) {
          isChasing = true;
          showMessage('何かが目覚めた...！逃げろ！');
        }

        if (isChasing) {
          monster1.group.lookAt(player.position.x, 0, player.position.z);
          monster1.head.position.x = Math.sin(time * 35) * 0.06;

          heartbeatTimer += delta;
          const heartbeatInterval = Math.max(0.18, dist1 * 0.045);
          if (heartbeatTimer > heartbeatInterval) {
            audio.playHeartbeat();
            heartbeatTimer = 0;
          }

          const chaseSpeed = 3.8 * delta;
          const chaseDir = new THREE.Vector3().subVectors(player.position, monster1.group.position);
          chaseDir.y = 0;
          chaseDir.normalize();

          // 建物の当たり判定を適用して移動
          const moveStep = chaseDir.multiplyScalar(chaseSpeed);
          moveMonsterWithCollision(monster1.group, moveStep, 0.5);

          // 接触判定（当たったら死ぬ）
          if (dist1 < 1.5) triggerGameOver(monster1.group);
        }

        // --- 【モンスター2（巡回型）のAI＆衝突判定】 ---
        const dist2 = player.position.distanceTo(monster2.group.position);
        monster2.head.position.x = Math.sin(time * 20) * 0.05;

        let patrolDirX = 0;
        if (monster2.group.position.x < patrolTargetX) {
          patrolDirX = patrolSpeed * delta;
          monster2.group.rotation.y = Math.PI / 2;
          if (monster2.group.position.x >= patrolTargetX) patrolTargetX = -30;
        } else {
          patrolDirX = -patrolSpeed * delta;
          monster2.group.rotation.y = -Math.PI / 2;
          if (monster2.group.position.x <= patrolTargetX) patrolTargetX = 30;
        }

        // 建物の当たり判定を適用して移動
        moveMonsterWithCollision(monster2.group, new THREE.Vector3(patrolDirX, 0, 0), 0.5);

        // 接触判定（当たったら死ぬ）
        if (dist2 < 1.6) triggerGameOver(monster2.group);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
