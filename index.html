<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>死の市 - Nightmare Edition with BGM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Courier New', Courier, serif, monospace;
      user-select: none;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* レトロVHS・走査線効果 */
    #vhs-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.3),
        rgba(0, 0, 0, 0.3) 1px,
        transparent 1px,
        transparent 2px
      );
      box-shadow: inset 0 0 160px rgba(0,0,0,0.95);
      z-index: 10;
    }

    #flash-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(255, 0, 0, 0.85);
      pointer-events: none;
      z-index: 15;
      opacity: 0;
      transition: opacity 0.08s ease;
    }

    #crosshair {
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 4px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
      display: none;
    }

    #ui {
      position: absolute;
      top: 20px; left: 20px;
      color: #ddd;
      z-index: 20;
      pointer-events: none;
      font-size: 13px;
      letter-spacing: 2px;
      display: none;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 14px;
      border: 1px solid #444;
      border-left: 4px solid #b30000;
      margin-bottom: 8px;
    }

    #stamina-bar-bg {
      width: 150px;
      height: 8px;
      background: #222;
      border: 1px solid #555;
      margin-top: 6px;
    }

    #stamina-bar {
      width: 100%;
      height: 100%;
      background: #00b359;
      transition: width 0.1s linear, background-color 0.2s;
    }

    #message-log {
      position: absolute;
      bottom: 40px;
      width: 100%;
      text-align: center;
      color: #ff2222;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 3px;
      z-index: 20;
      pointer-events: none;
      text-shadow: 0 0 10px #000, 0 0 20px #f00;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .btn-action {
      background: transparent;
      border: 1px solid #666;
      color: #ddd;
      padding: 14px 42px;
      font-size: 18px;
      font-family: inherit;
      letter-spacing: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .btn-action:hover {
      background: #800000;
      color: #fff;
      border-color: #f00;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
    }

    #title-screen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(25, 2, 2, 0.96) 0%, rgba(0,0,0,0.99) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30;
      color: #eee;
    }

    .game-title {
      font-size: 76px;
      color: #b30000;
      letter-spacing: 16px;
      margin-bottom: 5px;
      text-shadow: 0 0 25px rgba(255, 0, 0, 0.8), 4px 4px 0px #000;
      animation: pulse 2.5s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.75; text-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
      100% { opacity: 1; text-shadow: 0 0 40px rgba(255, 0, 0, 1), 0 0 10px rgba(255,255,255,0.8); }
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      letter-spacing: 6px;
      margin-bottom: 10px;
    }

    .controls-hint {
      margin-top: 25px;
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
      line-height: 1.8;
      text-align: center;
    }

    #gameover-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(30, 0, 0, 0.98);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      animation: goFlash 0.1s infinite alternate;
    }

    @keyframes goFlash {
      0% { background-color: rgba(70, 0, 0, 0.98); }
      100% { background-color: rgba(5, 0, 0, 0.99); }
    }

    .go-title {
      font-size: 84px;
      color: #ff0000;
      font-weight: bold;
      letter-spacing: 16px;
      text-shadow: 0 0 20px #000, 0 0 50px #f00;
      margin-bottom: 15px;
    }

    .go-sub {
      font-size: 16px;
      color: #ccc;
      letter-spacing: 4px;
      margin-bottom: 30px;
      text-shadow: 0 0 5px #000;
    }

    .go-hint {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
      letter-spacing: 2px;
    }

    #clear-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 20, 10, 0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }

    .clear-title {
      font-size: 64px;
      color: #00ff88;
      font-weight: bold;
      letter-spacing: 12px;
      text-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
      margin-bottom: 20px;
    }

    .clear-sub {
      font-size: 15px;
      color: #eee;
      letter-spacing: 4px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="vhs-overlay"></div>
  <div id="flash-overlay"></div>
  <div id="crosshair"></div>

  <div id="ui">
    <div class="hud-box">
      <div>『死の市』からの生還</div>
      <div style="margin-top:4px;">鍵: <span id="key-count" style="color:#ff3333; font-weight:bold;">0 / 5</span></div>
    </div>
    <div class="hud-box">
      <div>STAMINA</div>
      <div id="stamina-bar-bg"><div id="stamina-bar"></div></div>
    </div>
  </div>

  <div id="message-log"></div>

  <!-- タイトル画面 -->
  <div id="title-screen">
    <div class="game-title">死 の 市</div>
    <div class="subtitle">- NIGHTMARE BGM EDITION -</div>
    <button class="btn-action" id="start-btn">街 に 入 る</button>
    <div class="controls-hint">
      [W/A/S/D] 移動 | [Shift] ダッシュ | [マウス] 視点変更<br>
      【目標】街に隠された <span style="color:#ff3333">5つの鍵</span> を見つけて脱出せよ。<br>
      ※4つ目の鍵を回収すると、<span style="color:#ff0000; font-weight:bold;">超強力な異形</span> が目覚めます。<br>
      🎧 音量をオンにしてプレイしてください。
    </div>
  </div>

  <!-- ゲームオーバー画面 -->
  <div id="gameover-overlay">
    <div class="go-title">S L A U G H T E R</div>
    <div class="go-sub">肉体を切り刻まれ、あなたの魂は闇に呑まれた...</div>
    <button class="btn-action" id="retry-btn">タイトルへ戻る</button>
    <div class="go-hint">[ Space ] または画面クリックでも戻れます</div>
  </div>

  <!-- クリア画面 -->
  <div id="clear-overlay">
    <div class="clear-title">E S C A P E D</div>
    <div class="clear-sub">生きてこの地獄を抜け出すことに成功した！</div>
    <button class="btn-action" id="clear-title-btn">タイトルへ戻る</button>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- Advanced Horror Music Generator (Web Audio API) ---
    class HorrorMusicEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        
        this.baseGain = null;
        this.chaseGain = null;
        
        this.musicInterval = null;
        this.chaseOscs = [];
        
        // ホラー音楽用音階（不協和音・トリトーンを含む減三和音／短二度）
        this.notes = [130.81, 138.59, 155.56, 185.00, 196.00, 261.63, 277.18, 311.13, 369.99, 392.00];
      }

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
      }

      start() {
        this.init();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.isPlaying) return;
        this.isPlaying = true;

        const now = this.ctx.currentTime;

        // 1. 低音ドローン・環境音楽
        this.baseGain = this.ctx.createGain();
        this.baseGain.gain.setValueAtTime(0.35, now);
        this.baseGain.connect(this.ctx.destination);

        const subOsc = this.ctx.createOscillator();
        subOsc.type = 'sawtooth';
        subOsc.frequency.setValueAtTime(32.7, now); // C1

        const subFilter = this.ctx.createBiquadFilter();
        subFilter.type = 'lowpass';
        subFilter.frequency.setValueAtTime(90, now);

        subOsc.connect(subFilter);
        subFilter.connect(this.baseGain);
        subOsc.start();

        // 2. 追跡用ストリングス（不調和）
        this.chaseGain = this.ctx.createGain();
        this.chaseGain.gain.setValueAtTime(0.0, now);
        this.chaseGain.connect(this.ctx.destination);

        const chase1 = this.ctx.createOscillator();
        chase1.type = 'sawtooth';
        chase1.frequency.setValueAtTime(587.33, now); // D5

        const chase2 = this.ctx.createOscillator();
        chase2.type = 'square';
        chase2.frequency.setValueAtTime(622.25, now); // D#5 (不協和音)

        const chaseFilter = this.ctx.createBiquadFilter();
        chaseFilter.type = 'highpass';
        chaseFilter.frequency.setValueAtTime(400, now);

        chase1.connect(chaseFilter);
        chase2.connect(chaseFilter);
        chaseFilter.connect(this.chaseGain);

        chase1.start();
        chase2.start();

        this.chaseOscs = [subOsc, chase1, chase2];

        // 3. 自動生成ホラーメロディのシーケンス開始
        this.startMelodySequence();
      }

      startMelodySequence() {
        const step = () => {
          if (!this.isPlaying) return;

          // ランダムなリズムで不気味なピアノ・オルゴール音を生成
          if (Math.random() < 0.65) {
            this.playCreepyNote();
          }

          const nextTime = Math.random() * 800 + 400; // 0.4s〜1.2s間隔
          this.musicInterval = setTimeout(step, nextTime);
        };
        step();
      }

      playCreepyNote() {
        if (!this.ctx || !this.isPlaying) return;
        const now = this.ctx.currentTime;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        // ベル／オルゴール／歪んだピアノ風の音色設定
        osc.type = Math.random() < 0.5 ? 'sine' : 'triangle';
        const freq = this.notes[Math.floor(Math.random() * this.notes.length)];
        osc.frequency.setValueAtTime(freq, now);

        // 微かなピッチの揺れ（不気味さの演出）
        osc.frequency.linearRampToValueAtTime(freq * (1 + (Math.random() - 0.5) * 0.05), now + 1.5);

        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, now);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.baseGain);

        osc.start(now);
        osc.stop(now + 2.0);
      }

      updateChaseVolume(distance) {
        if (!this.ctx || !this.isPlaying || !this.chaseGain) return;

        const maxDist = 28.0;
        let volume = 0;

        if (distance < maxDist) {
          const factor = 1 - (distance / maxDist);
          volume = Math.pow(factor, 1.2) * 0.6;
        }

        this.chaseGain.gain.setTargetAtTime(volume, this.ctx.currentTime, 0.08);
      }

      playHeartbeat() {
        if (!this.ctx || !this.isPlaying) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(90, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.9, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }

      playKeyPickup() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
        osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.12);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
      }

      playGameoverSound() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // ノイズ不快音
        const bufferSize = this.ctx.sampleRate * 1.5;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.4));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = noiseBuffer;
        
        const noiseFilter = this.ctx.createBiquadFilter();
        noiseFilter.type = 'lowpass';
        noiseFilter.frequency.setValueAtTime(3000, now);
        noiseFilter.frequency.linearRampToValueAtTime(200, now + 1.5);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(1.0, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);

        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        noise.start(now);

        // 降下叫び音
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 2.0);

        gain.gain.setValueAtTime(0.9, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 2.0);
      }

      stop() {
        if (!this.isPlaying) return;
        this.isPlaying = false;
        if (this.musicInterval) clearTimeout(this.musicInterval);

        this.chaseOscs.forEach(osc => {
          try { osc.stop(); } catch(e){}
        });
        this.chaseOscs = [];
      }
    }

    const audio = new HorrorMusicEngine();

    // DOM Elements
    const container = document.getElementById('canvas-container');
    const titleScreen = document.getElementById('title-screen');
    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const clearTitleBtn = document.getElementById('clear-title-btn');
    const crosshair = document.getElementById('crosshair');
    const ui = document.getElementById('ui');
    const keyCountEl = document.getElementById('key-count');
    const staminaBar = document.getElementById('stamina-bar');
    const msgLog = document.getElementById('message-log');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const clearOverlay = document.getElementById('clear-overlay');
    const flashOverlay = document.getElementById('flash-overlay');

    // 3D Scene Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010103);
    scene.fog = new THREE.FogExp2(0x010103, 0.045);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.rotation.order = 'YXZ';

    const player = new THREE.Object3D();
    player.position.set(0, 1.6, 25);
    player.add(camera);
    scene.add(player);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.2));
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x1a2030, 0.6);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x334477, 0.3);
    moonLight.position.set(20, 50, 20);
    scene.add(moonLight);

    const flashlight = new THREE.SpotLight(0xfff0d0, 4.5, 25, Math.PI / 4.2, 0.4, 1);
    camera.add(flashlight);
    flashlight.position.set(0, 0, 0);
    flashlight.target.position.set(0, 0, -1);
    camera.add(flashlight.target);

    // Floor
    const floorGeo = new THREE.PlaneGeometry(180, 160);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x0d0d12, roughness: 0.95 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Building Texture
    function generateBuildingTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0f0f13';
      ctx.fillRect(0, 0, 128, 256);

      const cols = 3; const rows = 8;
      const padX = 12; const padY = 10;
      const w = (128 - padX * (cols + 1)) / cols;
      const h = (256 - padY * (rows + 1)) / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const x = padX + c * (w + padX);
          const y = padY + r * (h + padY);

          if (Math.random() < 0.15) {
            ctx.fillStyle = Math.random() < 0.5 ? '#e6c065' : '#5098bd';
          } else {
            ctx.fillStyle = '#050508';
          }
          ctx.fillRect(x, y, w, h);
        }
      }
      return new THREE.CanvasTexture(canvas);
    }

    const bldgTexture = generateBuildingTexture();
    const buildingColliders = [];

    function buildWideCity() {
      const bldgMat = new THREE.MeshStandardMaterial({ map: bldgTexture, roughness: 0.85 });
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x1a1a20 });

      for (let z = -70; z <= 50; z += 18) {
        for (let x = -45; x <= 45; x += 30) {
          if (Math.abs(x) < 8 && z > -50) continue;

          const h = 10 + (Math.abs(x * z) % 8);
          const w = 16;
          const d = 14;
          const bldg = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bldgMat);
          const posX = x + (z % 4);
          bldg.position.set(posX, h / 2, z);
          scene.add(bldg);

          buildingColliders.push({
            minX: posX - w / 2,
            maxX: posX + w / 2,
            minZ: z - d / 2,
            maxZ: z + d / 2
          });
        }
      }

      for (let z = -60; z <= 40; z += 25) {
        [-18, 0, 18].forEach(xPos => {
          const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 6), poleMat);
          pole.position.set(xPos, 3.5, z);
          scene.add(pole);

          const light = new THREE.PointLight(0xffa500, 1.1, 11);
          light.position.set(xPos, 6.5, z);
          scene.add(light);
        });
      }
    }
    buildWideCity();

    // Sign & Exit
    let exitDoor;
    function createMainSignAndDoor() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#040101';
      ctx.fillRect(0, 0, 512, 256);
      ctx.font = 'Bold 90px serif';
      ctx.fillStyle = '#cc0000';
      ctx.textAlign = 'center';
      ctx.fillText('死 の 市', 256, 150);

      const texture = new THREE.CanvasTexture(canvas);
      const signMesh = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), new THREE.MeshBasicMaterial({ map: texture }));
      signMesh.position.set(0, 5, -55);
      scene.add(signMesh);

      const signLight = new THREE.PointLight(0xff0000, 2.0, 12);
      signLight.position.set(0, 5, -53);
      scene.add(signLight);

      const doorGeo = new THREE.BoxGeometry(3.5, 5, 0.2);
      const doorMat = new THREE.MeshStandardMaterial({ color: 0x080808 });
      exitDoor = new THREE.Mesh(doorGeo, doorMat);
      exitDoor.position.set(0, 2.5, -62);
      scene.add(exitDoor);

      const doorLight = new THREE.PointLight(0x00ff88, 1.0, 8);
      doorLight.position.set(0, 5.2, -61);
      scene.add(doorLight);
    }
    createMainSignAndDoor();

    // Key Model
    function createKey3DModel() {
      const keyGroup = new THREE.Group();
      const goldMat = new THREE.MeshStandardMaterial({
        color: 0xffcc00,
        metalness: 0.85,
        roughness: 0.2,
        emissive: 0x554400
      });

      const headGeo = new THREE.TorusGeometry(0.18, 0.04, 8, 16);
      const headMesh = new THREE.Mesh(headGeo, goldMat);
      headMesh.position.y = 0.4;
      keyGroup.add(headMesh);

      const shaftGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.5, 8);
      const shaftMesh = new THREE.Mesh(shaftGeo, goldMat);
      shaftMesh.position.y = 0.15;
      keyGroup.add(shaftMesh);

      const toothGeo = new THREE.BoxGeometry(0.12, 0.15, 0.03);
      const toothMesh = new THREE.Mesh(toothGeo, goldMat);
      toothMesh.position.set(0.06, 0.0, 0);
      keyGroup.add(toothMesh);

      return keyGroup;
    }

    const keys = [];
    const keyPositions = [
      new THREE.Vector3(-32, 0.8, 15),
      new THREE.Vector3(32, 0.8, -10),
      new THREE.Vector3(-15, 0.8, -42),
      new THREE.Vector3(35, 0.8, 28),
      new THREE.Vector3(-35, 0.8, -25)
    ];

    function spawnKeys() {
      keys.forEach(k => {
        scene.remove(k.mesh);
        if(k.light) scene.remove(k.light);
      });
      keys.length = 0;

      keyPositions.forEach(pos => {
        const mesh = createKey3DModel();
        mesh.position.copy(pos);
        scene.add(mesh);

        const pointLight = new THREE.PointLight(0xffaa00, 1.5, 5);
        pointLight.position.copy(pos);
        scene.add(pointLight);

        keys.push({ mesh, light: pointLight, collected: false });
      });
    }

    // Monster Model
    function createScaryMonster(eyeColorHex = 0xff0000, isBoss = false) {
      const group = new THREE.Group();
      const monsterMat = new THREE.MeshStandardMaterial({ 
        color: isBoss ? 0x000000 : 0x020204, 
        roughness: 0.98,
        metalness: 0.1
      });

      const scale = isBoss ? 1.5 : 1.0;

      const bodyGeo = new THREE.ConeGeometry(0.25 * scale, 3.8 * scale, 5);
      const body = new THREE.Mesh(bodyGeo, monsterMat);
      body.rotation.x = Math.PI;
      body.position.y = 1.9 * scale;
      group.add(body);

      const headGeo = new THREE.DodecahedronGeometry(0.35 * scale);
      const head = new THREE.Mesh(headGeo, monsterMat);
      head.position.y = 3.6 * scale;
      group.add(head);

      const hornGeo = new THREE.ConeGeometry(0.04 * scale, 0.9 * scale, 4);
      for (let i = 0; i < (isBoss ? 6 : 3); i++) {
        const horn = new THREE.Mesh(hornGeo, monsterMat);
        horn.position.set(
          (Math.random() - 0.5) * 0.3 * scale,
          (3.9 + Math.random() * 0.3) * scale,
          (Math.random() - 0.5) * 0.3 * scale
        );
        horn.rotation.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5);
        group.add(horn);
      }

      const eyeMat = new THREE.MeshBasicMaterial({ color: eyeColorHex });
      const eyeGeo = new THREE.SphereGeometry(0.05 * scale, 6, 6);

      const eyeCount = isBoss ? 6 : 4;
      for (let i = 0; i < eyeCount; i++) {
        const eye = new THREE.Mesh(eyeGeo, eyeMat);
        eye.position.set(
          (Math.random() - 0.5) * 0.35 * scale,
          (3.5 + (Math.random() - 0.5) * 0.3) * scale,
          -0.3 * scale
        );
        group.add(eye);
      }

      const eyeLight = new THREE.PointLight(eyeColorHex, isBoss ? 2.5 : 1.0, isBoss ? 8 : 4);
      eyeLight.position.set(0, 3.6 * scale, -0.35 * scale);
      group.add(eyeLight);

      return { group, head, body, isBoss };
    }

    const monster1 = createScaryMonster(0xff0000);
    monster1.group.position.set(0, 0, -65);
    scene.add(monster1.group);

    const monster2 = createScaryMonster(0xff0055);
    monster2.group.position.set(-30, 0, -15);
    scene.add(monster2.group);

    const bossMonster = createScaryMonster(0xff0000, true);
    bossMonster.group.position.set(0, -100, 0);
    scene.add(bossMonster.group);

    let isBossSpawned = false;
    let patrolTargetX = 30;
    const patrolSpeed = 2.8;

    function triggerRedFlash() {
      flashOverlay.style.opacity = '1';
      setTimeout(() => {
        flashOverlay.style.opacity = '0';
      }, 300);
    }

    // Game States
    let isPlaying = false;
    let isChasing = false;
    let isGameOver = false;
    let isCleared = false;

    let keysCollectedCount = 0;
    let stamina = 100;
    const maxStamina = 100;
    let isExhausted = false;

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let isSprinting = false;
    let heartbeatTimer = 0;

    let isJumpingOver = false;
    let jumpTime = 0;

    function showMessage(msg) {
      msgLog.textContent = msg;
      msgLog.style.opacity = '1';
      setTimeout(() => { msgLog.style.opacity = '0'; }, 3000);
    }

    function returnToTitle() {
      gameoverOverlay.style.display = 'none';
      clearOverlay.style.display = 'none';
      titleScreen.style.display = 'flex';
      crosshair.style.display = 'none';
      ui.style.display = 'none';
      resetGame();
    }

    function resetGame() {
      player.position.set(0, 1.6, 25);
      player.rotation.set(0, 0, 0);
      camera.rotation.set(0, 0, 0);
      
      monster1.group.position.set(0, 0, -65);
      monster2.group.position.set(-30, 0, -15);
      
      bossMonster.group.position.set(0, -100, 0);
      isBossSpawned = false;

      patrolTargetX = 30;

      isChasing = false;
      isGameOver = false;
      isCleared = false;
      isJumpingOver = false;
      jumpTime = 0;

      keysCollectedCount = 0;
      stamina = maxStamina;
      isExhausted = false;

      keyCountEl.textContent = `0 / ${keyPositions.length}`;
      staminaBar.style.width = '100%';
      staminaBar.style.backgroundColor = '#00b359';

      spawnKeys();
    }

    startBtn.addEventListener('click', () => {
      resetGame();
      document.body.requestPointerLock();
    });

    retryBtn.addEventListener('click', returnToTitle);
    clearTitleBtn.addEventListener('click', returnToTitle);

    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === document.body && !isGameOver && !isCleared) {
        isPlaying = true;
        titleScreen.style.display = 'none';
        crosshair.style.display = 'block';
        ui.style.display = 'block';
        audio.start();
      } else if (!isGameOver && !isCleared) {
        isPlaying = false;
        titleScreen.style.display = 'flex';
        crosshair.style.display = 'none';
        ui.style.display = 'none';
        audio.stop();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (!isPlaying || isGameOver || isCleared) return;

      const sensitivity = 0.002;
      player.rotation.y -= e.movementX * sensitivity;
      
      camera.rotation.x -= e.movementY * sensitivity;
      camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
    });

    document.addEventListener('keydown', (e) => {
      if (isGameOver) {
        if (e.code === 'Space' || e.code === 'Enter') returnToTitle();
        return;
      }

      switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
        case 'ShiftLeft':
        case 'ShiftRight': isSprinting = true; break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
        case 'ShiftLeft':
        case 'ShiftRight': isSprinting = false; break;
      }
    });

    gameoverOverlay.addEventListener('click', (e) => {
      if (e.target !== retryBtn) returnToTitle();
    });

    function checkBuildingCollision(newX, newZ, radius = 0.6) {
      for (let i = 0; i < buildingColliders.length; i++) {
        const b = buildingColliders[i];
        if (newX + radius > b.minX && newX - radius < b.maxX &&
            newZ + radius > b.minZ && newZ - radius < b.maxZ) {
          return true;
        }
      }
      return false;
    }

    function moveMonsterWithCollision(monsterGroup, moveVec, radius = 0.4) {
      const oldX = monsterGroup.position.x;
      const oldZ = monsterGroup.position.z;

      const targetX = oldX + moveVec.x;
      const targetZ = oldZ + moveVec.z;

      if (!checkBuildingCollision(targetX, targetZ, radius)) {
        monsterGroup.position.x = targetX;
        monsterGroup.position.z = targetZ;
      } else {
        if (!checkBuildingCollision(targetX, oldZ, radius)) {
          monsterGroup.position.x = targetX;
        } else if (!checkBuildingCollision(oldX, targetZ, radius)) {
          monsterGroup.position.z = targetZ;
        }
      }
    }

    function triggerGameOver(caughtMonsterGroup) {
      if (isGameOver || isCleared) return;
      isGameOver = true;
      isPlaying = false;

      if (document.pointerLockElement) {
        document.exitPointerLock();
      }

      audio.stop();
      audio.playGameoverSound();
      triggerRedFlash();

      isJumpingOver = true;
      jumpTime = 0;
    }

    function triggerGameClear() {
      if (isCleared || isGameOver) return;
      isCleared = true;
      isPlaying = false;
      document.exitPointerLock();

      audio.stop();
      clearOverlay.style.display = 'flex';
    }

    // Main Loop
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Keys Animation
      keys.forEach(k => {
        if (!k.collected) {
          k.mesh.rotation.y += delta * 2.5;
          k.mesh.position.y = 0.8 + Math.sin(time * 3) * 0.1;
          if (k.light) k.light.position.y = k.mesh.position.y;
        }
      });

      // Monster Glitch
      [monster1, monster2, bossMonster].forEach((m, idx) => {
        const speed = idx === 2 ? 22 : (idx === 0 ? 14 : 9);
        const glitch = (Math.random() - 0.5) * 0.05;
        m.head.position.x = Math.sin(time * speed) * 0.1 + glitch;
        m.head.position.z = Math.cos(time * speed * 0.8) * 0.08;
        m.body.rotation.z = Math.sin(time * 6) * 0.08;
      });

      if (isJumpingOver) {
        jumpTime += delta * 8;
        player.position.y = 1.6 + Math.sin(jumpTime) * 1.8;
        camera.rotation.x = -Math.PI / 3 + Math.sin(jumpTime * 2.5) * 0.3;

        if (jumpTime > Math.PI) {
          isJumpingOver = false;
          gameoverOverlay.style.display = 'flex';
        }
      }

      if (isPlaying && !isGameOver && !isCleared) {
        const isMoving = moveForward || moveBackward || moveLeft || moveRight;
        let speedMultiplier = 1.0;

        if (isSprinting && isMoving && !isExhausted) {
          speedMultiplier = 1.75;
          stamina -= 48 * delta;
          if (stamina <= 0) {
            stamina = 0;
            isExhausted = true;
            staminaBar.style.backgroundColor = '#ff3333';
          }
        } else {
          stamina += 16 * delta;
          if (stamina >= maxStamina) {
            stamina = maxStamina;
            isExhausted = false;
            staminaBar.style.backgroundColor = '#00b359';
          }
        }

        staminaBar.style.width = `${(stamina / maxStamina) * 100}%`;

        const moveSpeed = 3.6 * speedMultiplier * delta;
        const oldX = player.position.x;
        const oldZ = player.position.z;

        if (moveForward) player.translateZ(-moveSpeed);
        if (moveBackward) player.translateZ(moveSpeed);
        if (moveLeft) player.translateX(-moveSpeed);
        if (moveRight) player.translateX(moveSpeed);

        player.position.y = 1.6;

        if (checkBuildingCollision(player.position.x, player.position.z, 0.6)) {
          if (!checkBuildingCollision(player.position.x, oldZ, 0.6)) {
            player.position.z = oldZ;
          } else if (!checkBuildingCollision(oldX, player.position.z, 0.6)) {
            player.position.x = oldX;
          } else {
            player.position.x = oldX;
            player.position.z = oldZ;
          }
        }

        player.position.x = Math.max(-42.0, Math.min(42.0, player.position.x));
        player.position.z = Math.max(-63, Math.min(35, player.position.z));

        // Keys Pickup
        keys.forEach(k => {
          if (!k.collected && player.position.distanceTo(k.mesh.position) < 1.5) {
            k.collected = true;
            scene.remove(k.mesh);
            if (k.light) scene.remove(k.light);
            keysCollectedCount++;
            keyCountEl.textContent = `${keysCollectedCount} / ${keyPositions.length}`;
            audio.playKeyPickup();

            if (keysCollectedCount === 4) {
              isBossSpawned = true;
              bossMonster.group.position.set(0, 0, -60);
              triggerRedFlash();
              showMessage('⚠️ 警 告 ⚠️ 超巨大な凶悪異形が解き放たれた！！');
            } else if (keysCollectedCount < keyPositions.length) {
              showMessage(`鍵を手に入れた (${keysCollectedCount}/${keyPositions.length})`);
            } else {
              showMessage('すべての鍵が集まった！中央最深部の扉から脱出せよ！');
            }
          }
        });

        if (player.position.z < -60 && Math.abs(player.position.x) < 4) {
          if (keysCollectedCount >= keyPositions.length) {
            triggerGameClear();
          } else {
            showMessage(`扉は鍵がかかっている... (鍵が${keyPositions.length}個必要)`);
          }
        }

        const pPos = new THREE.Vector3(player.position.x, 0, player.position.z);

        // Monster 1
        const m1Pos = new THREE.Vector3(monster1.group.position.x, 0, monster1.group.position.z);
        const dist1 = pPos.distanceTo(m1Pos);

        if (player.position.z < 12 && !isChasing) {
          isChasing = true;
          showMessage('何かが目覚めた...！逃げろ！');
        }

        if (isChasing) {
          monster1.group.lookAt(player.position.x, 0, player.position.z);

          heartbeatTimer += delta;
          const heartbeatInterval = Math.max(0.15, dist1 * 0.04);
          if (heartbeatTimer > heartbeatInterval) {
            audio.playHeartbeat();
            heartbeatTimer = 0;
          }

          const chaseSpeed = 3.9 * delta;
          const chaseDir = new THREE.Vector3().subVectors(pPos, m1Pos).normalize();
          moveMonsterWithCollision(monster1.group, chaseDir.multiplyScalar(chaseSpeed), 0.4);

          if (dist1 < 2.0) triggerGameOver(monster1.group);
        }

        // Monster 2
        const m2Pos = new THREE.Vector3(monster2.group.position.x, 0, monster2.group.position.z);
        const dist2 = pPos.distanceTo(m2Pos);

        let patrolDirX = 0;
        if (monster2.group.position.x < patrolTargetX) {
          patrolDirX = patrolSpeed * delta;
          monster2.group.rotation.y = Math.PI / 2;
          if (monster2.group.position.x >= patrolTargetX) patrolTargetX = -30;
        } else {
          patrolDirX = -patrolSpeed * delta;
          monster2.group.rotation.y = -Math.PI / 2;
          if (monster2.group.position.x <= patrolTargetX) patrolTargetX = 30;
        }

        moveMonsterWithCollision(monster2.group, new THREE.Vector3(patrolDirX, 0, 0), 0.4);
        if (dist2 < 2.0) triggerGameOver(monster2.group);

        // Boss Monster
        let distBoss = 999;
        if (isBossSpawned) {
          const mBossPos = new THREE.Vector3(bossMonster.group.position.x, 0, bossMonster.group.position.z);
          distBoss = pPos.distanceTo(mBossPos);

          bossMonster.group.lookAt(player.position.x, 0, player.position.z);

          const bossSpeed = 4.8 * delta;
          const bossDir = new THREE.Vector3().subVectors(pPos, mBossPos).normalize();
          moveMonsterWithCollision(bossMonster.group, bossDir.multiplyScalar(bossSpeed), 0.6);

          if (distBoss < 2.5) triggerGameOver(bossMonster.group);
        }

        // Update Chase Volume
        const nearestMonsterDist = Math.min(dist1, dist2, distBoss);
        audio.updateChaseVolume(nearestMonsterDist);
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
